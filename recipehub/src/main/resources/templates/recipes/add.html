<!-- templates/recipes/add.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Добавить рецепт — RecipeHub</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header>
    <nav>
        <a th:href="@{/}">Главная</a> |
        <a th:href="@{/recipes}">Все рецепты</a> |
        <a th:href="@{/favorites}" sec:authorize="isAuthenticated()">Избранное</a> |

        <span sec:authorize="!isAuthenticated()">
            <a th:href="@{/auth/login}">Вход</a> ·
            <a th:href="@{/auth/register}">Регистрация</a>
        </span>

        <span sec:authorize="isAuthenticated()">
            Залогинен как: <span sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post" style="display:inline">
                <button type="submit" class="secondary">Выйти</button>
            </form>
        </span>
    </nav>
</header>

<main>
    <h1>Добавить рецепт</h1>

    <form th:action="@{/recipes/add}"
          th:object="${form}"
          method="post">

        <!-- Если у тебя включён CSRF и нет глобального решения, можно добавить: -->
        <!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/> -->

        <!-- Основная информация -->
        <section>
            <label>
                Название:
                <input type="text" th:field="*{title}">
            </label>
            <div th:if="${#fields.hasErrors('title')}"
                 th:errors="*{title}" class="error"></div>

            <label>
                Краткое описание:
                <textarea th:field="*{shortDescription}"></textarea>
            </label>
            <div th:if="${#fields.hasErrors('shortDescription')}"
                 th:errors="*{shortDescription}" class="error"></div>

            <label>
                Полное описание:
                <textarea th:field="*{description}"></textarea>
            </label>
            <div th:if="${#fields.hasErrors('description')}"
                 th:errors="*{description}" class="error"></div>

            <label>
                Время приготовления (мин):
                <input type="number" min="1" th:field="*{cookingTimeMinutes}">
            </label>
            <div th:if="${#fields.hasErrors('cookingTimeMinutes')}"
                 th:errors="*{cookingTimeMinutes}" class="error"></div>

            <label>
                Сложность:
                <select th:field="*{difficulty}">
                    <option value="">-- выберите --</option>
                    <option th:value="EASY">Легко</option>
                    <option th:value="MEDIUM">Средне</option>
                    <option th:value="HARD">Сложно</option>
                </select>
            </label>
            <div th:if="${#fields.hasErrors('difficulty')}"
                 th:errors="*{difficulty}" class="error"></div>

            <label>
                Категории:
                <select multiple th:field="*{categoryIds}">
                    <option th:each="cat : ${view.availableCategories}"
                            th:value="${cat.id}"
                            th:text="${cat.name}"></option>
                </select>
            </label>
            <div th:if="${#fields.hasErrors('categoryIds')}"
                 th:errors="*{categoryIds}" class="error"></div>
        </section>

        <!-- Ингредиенты -->
        <section>
            <h2>Ингредиенты</h2>

            <div id="ingredients-container">
                <div th:each="ing, iter : *{ingredients}"
                     class="ingredient-row">

                    <input type="text"
                           placeholder="Название"
                           th:field="*{ingredients[__${iter.index}__].name}">

                    <input type="number"
                           step="0.01"
                           placeholder="Количество"
                           th:field="*{ingredients[__${iter.index}__].amount}">

                    <input type="text"
                           placeholder="Ед. изм. (шт, г, мл...)"
                           th:field="*{ingredients[__${iter.index}__].unit}">
                </div>
            </div>

            <button type="button" onclick="addIngredient()">+ Добавить ингредиент</button>
        </section>

        <!-- Шаги приготовления -->
        <section>
            <h2>Шаги приготовления</h2>

            <div id="steps-container">
                <div th:each="s, iter : *{steps}"
                     class="step-row">
                    <label>
                        Шаг <span th:text="${iter.index + 1}">1</span>:
                        <textarea th:field="*{steps[__${iter.index}__].text}"
                                  placeholder="Опишите этот шаг"></textarea>
                    </label>
                </div>
            </div>

            <button type="button" onclick="addStep()">+ Добавить шаг</button>
        </section>

        <section>
            <button type="submit">Сохранить рецепт</button>
        </section>

    </form>
</main>

<script>
    function addIngredient() {
        const container = document.getElementById('ingredients-container');
        const index = container.children.length;

        const div = document.createElement('div');
        div.className = 'ingredient-row';
        div.innerHTML = `
            <input type="text"
                   name="ingredients[${index}].name"
                   placeholder="Название">

            <input type="number"
                   step="0.01"
                   name="ingredients[${index}].amount"
                   placeholder="Количество">

            <input type="text"
                   name="ingredients[${index}].unit"
                   placeholder="Ед. изм. (шт, г, мл...)">
        `;
        container.appendChild(div);
    }

    function addStep() {
        const container = document.getElementById('steps-container');
        const index = container.children.length;

        const div = document.createElement('div');
        div.className = 'step-row';
        div.innerHTML = `
            <label>
                Шаг ${index + 1}:
                <textarea name="steps[${index}].text"
                          placeholder="Опишите этот шаг"></textarea>
            </label>
        `;
        container.appendChild(div);
    }
</script>

</body>
</html>
