# =========================
#   SERVER / BASE
# =========================
spring.application.name=RecipeHub
server.port=8080

# =========================
#   DATASOURCE (PostgreSQL)
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/recipehub
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
#   JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================
#   THYMELEAF
# =========================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# =========================
#   LOGGING
# =========================
logging.level.org.springframework=INFO
logging.level.ru.rutmiit.recipehub=DEBUG

app.admin.email=admin@recipehub.local
app.admin.password=admin123

app.moderator.email=moderator@recipehub.local
app.moderator.password=moder123
